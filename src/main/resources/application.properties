# ===================================================================
# Global Configuration (Applies to all profiles)
# ===================================================================
server.port=${PORT:8080}

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Logging Configuration
logging.level.com.polling.app=INFO
logging.level.org.hibernate.SQL=ERROR

# Application Configuration
app.name=Polling Application
app.version=1.0.0
app.description=A polling application for users and admins

# Set fallback default profile to dev
spring.profiles.default=dev

#---
spring.config.activate.on-profile=dev
# ===================================================================
# Dev Profile Configuration (Safe H2 In-Memory)
# ===================================================================
spring.datasource.url=jdbc:h2:mem:polling_db;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

#---
spring.config.activate.on-profile=prod
# ===================================================================
# Prod Profile Configuration (MySQL Database on Railway)
# ===================================================================
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
